name: Documentation, skill and reference checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install checker dependencies
        run: python -m pip install -r requirements-checks.txt
      - name: Test checker failure cases
        run: python -m unittest scripts.tests.test_check_docs -v
      - name: Check public docs and reproducible skill package
        run: python scripts/check_docs.py

  reference:
    name: Core and reservations (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Run standalone reference tests
        run: python -S -m unittest discover -s reference/tests -t . -v
      - name: Check deliberately broken implementations
        run: python -S -m reference.mutations

  grouped:
    name: Grouped coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Run standalone grouped tests
        run: python -S -m unittest discover -s reference/grouped/tests -t . -v
      - name: Check deliberately broken grouped implementations
        run: python -S -m reference.grouped.mutations

  placement:
    name: Placement contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Run standalone placement tests
        run: python -S -m unittest discover -s reference/placement/tests -t . -v
      - name: Check deliberately broken placement implementations
        run: python -S -m reference.placement.mutations
      - name: Compare all three contracts on matching inputs
        run: python -S -m reference.placement.comparison --suite smoke

  skill-self-check:
    name: Skill self-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Test the standalone oracle, adapters and checker
        run: python -S -m unittest scripts.tests.test_skill_oracle scripts.tests.test_skill_self_check -v
      - name: Check the three deliberately broken sample pagers
        run: python -S skills/kc-state-vector/scripts/mutations.py
      - name: Exercise the complete sample adapter
        run: python -S skills/kc-state-vector/scripts/check_pager.py --adapter skills/kc-state-vector/scripts/sample_pager.py --max-page-size 2
