name: Documentation and skill checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install checker dependencies
        run: python -m pip install -r requirements-checks.txt
      - name: Test checker failure cases
        run: python -m unittest discover -s scripts/tests -v
      - name: Check public docs and reproducible skill package
        run: python scripts/check_docs.py
